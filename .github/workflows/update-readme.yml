name: Update README project table

on:
  push:
    branches:
      - main
    paths:
      - '*/index.html'
      - 'scripts/update-readme.mjs'
      - '.github/workflows/update-readme.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate project table
        run: node scripts/update-readme.mjs
      - name: Commit updated README
        run: |
          if git diff --quiet -- README.md; then
            echo "README project table is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: update README project table"
          git push
